# gitleaks reads this file from the repo root; the default rules stay on.
[extend]
useDefault = true

# OBS stores a PipeWire screen-capture portal token as `RestoreToken` in each scene
# collection. It only lets this machine's OBS skip the "share your screen" prompt; it is
# not a credential and it changes on every launch.
[[allowlists]]
description = "OBS PipeWire RestoreToken"
condition = "AND"
paths = ['''^\.config/obs-studio/basic/scenes/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''"RestoreToken"''']
