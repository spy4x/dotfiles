# Auto-generated from opencode/agents/research.md
# Body verbatim from the OpenCode agent file. Global AGENTS.md rules are
# folded in at runtime by @deepseek-ai/dsh-agent-instructions — they do not
# need to be repeated here.
#
# Skill discovery + tool: mounted per-preset because dsh-web-app disables
# them at the host level (presets own local discovery). skill-filesystem
# reads <dshHome>/skills for the global catalog; tool-skill exposes the
# catalog + loader to the model.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      Research agent. Perform fast, focused exploration: codebase searches, design comparisons, dependency checks, and light external research when authorized. Summarize findings concisely with actionable next steps. Use Task tool to escalate deeper research. Be concise and cite sources when external info is used.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: filesystem

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
