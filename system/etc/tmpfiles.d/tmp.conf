# Overrides /usr/lib/tmpfiles.d/tmp.conf by basename, which is what the comment
# in that file invites. A file under a different name would also win, by sort
# order, but systemd logs "Duplicate line for path /tmp" on every cleanup run.
# Upstream has only these two lines, so replacing it whole loses nothing.
#
# /tmp is tmpfs here, so anything left in it holds RAM until the next reboot.
# Agent sessions create throwaway Deno caches (DENO_DIR=$(mktemp -d)) worth
# about 5 MB in a dependency-light repo and over 150 MB in a Fresh app with npm
# dependencies. Each run is told to delete its own; 2 days is the backstop for
# the ones that get killed. Fedora's default of 10 days let ~8 GB accumulate.
q /tmp 1777 root root 2d
q /var/tmp 1777 root root 30d
