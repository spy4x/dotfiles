# Woodpecker CI (self-hosted, same instance as the other spy4x repos).
# `deno task ai --check` is left out on purpose: it compares this machine's harness
# folders, and CI has none to compare.
when:
  - event: [push, pull_request]
    branch: main

steps:
  check:
    image: denoland/deno:2.9.7
    commands:
      # The image has neither `git` nor `ps`; the env-key-copy and sweep-orphans tests run both.
      # The secrets-backup and work-backup tests run `restic`; the demo-video encoder test runs ffmpeg and fc-match.
      # The record test runs `jq` and ffmpeg.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git procps restic ffmpeg fontconfig jq
      - deno --version
      - deno fmt --check
      - deno lint
      - deno task test
      # Fails when the run changed deno.lock: a new dependency needs its lockfile committed.
      - git diff --exit-code deno.lock
  # Mod tests import `claude-code/testing`, which only `claude plugin test` provides, so
  # `deno task test` skips them. It needs no login. Bump the pinned version when this machine's
  # Claude Code moves: the mods run on that engine.
  mod-tests:
    image: node:24.11-slim@sha256:48abc13a19400ca3985071e287bd405a1d99306770eb81d61202fb6b65cf0b57
    commands:
      - npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.331
      # Every mod, so a new one is tested without a pipeline change.
      - for d in ai-harnesses/settings/claude/mods/*/; do claude plugin test "$$d" || exit 1; done
